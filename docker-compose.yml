services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krs-dam-api
    environment:
      - PORT=8000
      - MLFLOW_TRACKING_URI=file:/app/mlruns
    volumes:
      - ./mlruns:/app/mlruns
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - krs-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: krs-dam-dashboard
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://api:8000
      - PORT=8501
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - krs-network

networks:
  krs-network:
    driver: bridge

