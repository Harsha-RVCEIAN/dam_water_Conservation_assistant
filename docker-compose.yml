version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krs_dam_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MPLCONFIGDIR=/app/.cache/matplotlib
      - LOKY_MAX_CPU_COUNT=1
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./models:/app/models
      - ./reports:/app/reports
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krs_dam_dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - MPLCONFIGDIR=/app/.cache/matplotlib
      - LOKY_MAX_CPU_COUNT=1
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data
    command: ["streamlit", "run", "src/rainfall_dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krs_dam_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:///mlflow.db", "--default-artifact-root", "./mlartifacts", "--host", "0.0.0.0", "--port", "5000"]
    restart: unless-stopped
