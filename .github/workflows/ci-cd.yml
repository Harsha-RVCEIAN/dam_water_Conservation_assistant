name: KRS Dam CI

on:
  push:
    branches: [harsha, main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q src

      - name: Run focused tests
        run: |
          pytest -q \
            --junitxml=test-results.xml \
            tests/test_api_schemas.py \
            tests/test_api.py \
            tests/test_api_client.py \
            tests/test_model_registry.py \
            tests/test_forecasting.py \
            tests/test_model_artifact_provenance.py \
            tests/test_app_smoke.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: warn

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Backend Docker image
        run: docker build -t krs-dam-api:ci .

      - name: Build Frontend Streamlit Docker image
        run: docker build -f Dockerfile.streamlit -t krs-dam-dashboard:ci .
