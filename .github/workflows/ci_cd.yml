name: CI/CD Pipeline - KRS Dam Assistant

on:
  push:
    branches:
      - master
      - harshad
      - Harshad
      - hadi
      - hadi-rainfall-phase2
  pull_request:
    branches:
      - master
      - harshad
      - Harshad
      - hadi
      - hadi-rainfall-phase2

jobs:
  test-and-quality-gate:
    name: Model Tests & Automated Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 httpx

      - name: Lint & Code Style Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-fatal
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Full Test Suite
        env:
          MPLCONFIGDIR: /tmp/matplotlib
          LOKY_MAX_CPU_COUNT: "1"
        run: |
          pytest tests/test_api.py tests/test_model_risk.py tests/test_rainfall_features.py tests/test_rainfall_pipeline.py -v

      - name: Execute Model Quality Gate
        env:
          MPLCONFIGDIR: /tmp/matplotlib
          LOKY_MAX_CPU_COUNT: "1"
        run: |
          python src/models/evaluate_gate.py

      - name: Verify Quality Gate Verdict
        run: |
          python -c "
          import json
          with open('reports/quality_gate_report.json') as f:
              report = json.load(f)
          assert report['status'] == 'PASSED', f'Quality gate failed: {report}'
          print('Quality gate passed successfully in CI/CD pipeline.')
          "

      - name: Upload Quality Gate Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: reports/quality_gate_report.json
          retention-days: 14

  docker-dry-run:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test-and-quality-gate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: krs-dam-assistant:latest
